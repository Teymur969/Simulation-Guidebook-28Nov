:root{
  --ink:#0D0C4E; --ink2:#2B2F45; --mute:#5A6B7E; --mute2:#8592A3;
  --bg:#F4F5FA; --card:#FFFFFF; --rule:#E2E6EE; --rule2:#CDD5E2;
  --pink:#EE4D9B; --pinkD:#C42F7A; --pinkL:#FDE8F2; --lilac:#7781B8; --lilacL:#ECEEF8; --teal:#0E8C80; --tealL:#E0F3F0;
  --yellow:#E7E629; --yellowL:#FBFBD8; --orange:#EA8A2E;
  --gold:#C9A74E; --goldL:#F8F0DC; --silver:#8E95A3; --silverL:#EEF0F4; --bronze:#B57A4E; --bronzeL:#F7ECE3;
  --display:"Expo BG","Axiforma",system-ui,sans-serif;
  --body:"Axiforma",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;margin:0;line-height:.98;letter-spacing:.01em}
h1{font-size:34px} h2{font-size:24px;margin:0 0 10px} h3{font-size:17px;margin:18px 0 8px}
p{margin:0 0 10px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}

/* top bar */
.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
.bar img{height:30px;cursor:pointer}
.bar .sp{flex:1}
.back{border:0;background:var(--lilacL);border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;display:none}
.back.on{display:inline-block}
.lang{display:flex;border:1.5px solid var(--ink);border-radius:20px;overflow:hidden}
.lang button{border:0;background:#fff;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--ink);color:#fff}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:8px 4px 9px;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pinkD)}

/* hero */
.hero{margin:16px 0 14px;border-radius:20px;padding:22px 20px 20px;background:linear-gradient(150deg,#FFFFFF 0%,#F3EFFA 55%,#FCE4F0 100%);border:1px solid var(--rule);position:relative;overflow:hidden}
.hero .kick{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--pinkD)}
.hero h1{margin:8px 0 10px}
.hero h1 .g{background:linear-gradient(90deg,#E8569C,#7781B8 50%,#2DA597);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--ink2);max-width:440px}
.count{display:inline-flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--rule2);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700}
.keys{display:flex;align-items:flex-end;gap:3px;height:46px;margin:16px -20px -20px;padding:0 14px}
.keys i{flex:1;border-radius:3px 3px 0 0;display:block}

.cta{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:18px;background:var(--ink);color:#fff;padding:18px;text-align:left;cursor:pointer;margin-bottom:14px}
.cta .ic{width:46px;height:46px;border-radius:14px;background:var(--pink);display:grid;place-items:center;flex:none}
.cta .ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2}
.cta b{display:block;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:20px;line-height:1}
.cta span{font-size:13px;color:#C9CDEB}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--rule);background:#fff;border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:104px}
.tile .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.tile .ti svg{width:19px;height:19px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:14.5px;line-height:1.2}
.tile span{font-size:12px;color:var(--mute);line-height:1.3}

.card{background:#fff;border:1px solid var(--rule);border-radius:18px;padding:18px;margin-bottom:12px}
.sec{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--pinkD);margin:22px 0 8px}
.lead{font-size:16px;color:var(--ink2)}
.small{font-size:12.5px;color:var(--mute)}
.tbc{display:inline-block;background:var(--yellowL);color:#6B6A00;border:1px solid #D8D74A;font-size:10.5px;padding:1px 8px;border-radius:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;vertical-align:1px}
ul.clean{margin:0;padding-left:18px} ul.clean li{margin-bottom:6px}

/* pickers */
.search{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--rule2);background:#fff;margin:4px 0 12px}
.dlist{display:grid;gap:8px}
.drow{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.drow .dot{width:12px;height:36px;border-radius:6px;flex:none}
.drow b{display:block;font-size:15px}
.drow span{font-size:12.5px;color:var(--mute)}
.drow .ar{margin-left:auto;color:var(--mute2);font-size:20px}
.pos{border:1px solid var(--rule);background:#fff;border-radius:16px;padding:14px;cursor:pointer;width:100%;text-align:left;display:block}
.pos .t{font-weight:700;font-size:15px}
.pos .pl{font-size:12.5px;color:var(--mute);margin:2px 0 8px}
.shiftline{display:flex;gap:8px;font-size:13px;margin-top:3px}
.shiftline em{font-style:normal;font-weight:700;color:var(--mute);width:62px;flex:none}

/* my page */
.me{border-radius:20px;overflow:hidden;margin:14px 0 12px;border:1px solid var(--rule);background:#fff}
.me .hd{padding:18px;color:#fff;position:relative}
.me .hd .dn{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.92}
.me .hd .rn{font-family:var(--display);font-size:27px;line-height:.98;text-transform:uppercase;margin-top:6px;padding-right:76px}
.me .hd .lv{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.95);color:var(--ink);font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:4px 10px;border-radius:12px;text-transform:uppercase}
.where{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--rule)}
.where .fl{font-family:var(--display);font-size:44px;line-height:.8;min-width:62px;text-align:center;border-radius:14px;padding:12px 6px 6px;color:#fff}
.where .fl small{display:block;font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.08em;margin-top:4px}
.where b{display:block;font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--rule2);background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pane{padding:12px 18px 18px}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.person:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.person .nm{font-weight:700;font-size:14.5px}
.person .rl{font-size:12px;color:var(--mute)}
.person .call{margin-left:auto;display:flex;gap:6px;flex:none}
.person .call a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--tealL);text-decoration:none}
.person .call a svg{width:18px;height:18px;stroke:var(--teal);fill:none;stroke-width:2}
.shiftchip{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:10px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.s1{background:#FFF1D6;color:#8A5A00}.s2{background:var(--lilacL);color:#3E4890}.s12{background:var(--tealL);color:#0B6B62}
.kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule)}
.kv:last-child{border-bottom:0}
.kv .k{width:110px;flex:none;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding-top:2px}
.kv .v{flex:1}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{position:relative;padding:4px 0 12px 44px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;width:30px;height:30px;border-radius:9px;background:var(--pink);color:#fff;font-family:var(--display);font-size:18px;display:grid;place-items:center;padding-top:2px}
.steps li b{display:block}
.tl{list-style:none;margin:0;padding:0;border-left:3px solid var(--lilacL);margin-left:6px}
.tl li{position:relative;padding:0 0 14px 18px}
.tl li::before{content:"";position:absolute;left:-8px;top:4px;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--lilac)}
.tl li .tm{font-weight:700;font-size:13px;color:var(--lilac)}
.note{border-radius:14px;padding:12px 14px;background:var(--lilacL);font-size:14px;margin:10px 0}
.note.pink{background:var(--pinkL)} .note.teal{background:var(--tealL)} .note.yel{background:var(--yellowL)}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;margin:0 4px 4px 0}

/* reference */
.reflist{display:grid;gap:8px}
.lvl{border-radius:14px;padding:12px 14px;display:flex;gap:12px;margin-bottom:8px}
.lvl .pc{font-family:var(--display);font-size:30px;line-height:.85;min-width:56px}
.lvl .pc small{display:block;font-family:var(--body);font-size:10px;font-weight:700}
.lvl.g{background:var(--goldL)} .lvl.g .pc{color:#9A7A2A}
.lvl.s{background:var(--silverL)} .lvl.s .pc{color:#5E6573}
.lvl.b{background:var(--bronzeL)} .lvl.b .pc{color:#8E5A33}
.sev{display:flex;border-radius:14px;overflow:hidden;margin-bottom:7px;border:1px solid var(--rule);background:#fff}
.sev .n{flex:none;width:52px;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:#fff}
.sev .d{padding:9px 12px;font-size:13.5px}
.sev .d b{display:block;font-size:14px}
.floors{display:grid;gap:6px}
.floor{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--rule);background:#fff}
.floor .no{width:48px;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:22px;color:#fff}
.floor .tx{padding:8px 12px;font-size:13px}
.floor .tx b{display:block;font-size:14px}
.floor.me{outline:3px solid var(--pink)}
.map{width:100%;border-radius:12px;border:1px solid var(--rule);display:block}
.tool{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.tool:last-child{border-bottom:0}
.tool .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.tool .ic svg{width:21px;height:21px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool b{display:block}
.faq details{border-bottom:1px solid var(--rule);padding:12px 0}
.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;gap:10px}
.faq summary::after{content:"+";margin-left:auto;font-size:20px;line-height:1;color:var(--pinkD)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin:8px 0 0;color:var(--ink2)}
.wa{display:flex;align-items:center;gap:12px;border-radius:16px;background:#E7F8EE;padding:14px;text-decoration:none;margin:12px 0}
.wa .ic{width:42px;height:42px;border-radius:50%;background:#25D366;display:grid;place-items:center;flex:none}
.wa .ic svg{width:22px;height:22px;fill:#fff}
.wa b{display:block}
.wa span{font-size:12.5px;color:var(--mute)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.p{background:var(--pink);border-color:var(--pink);color:#fff}
.draft{font-size:11.5px;color:var(--mute);text-align:center;margin:24px 0 0}
.empty{border:2px dashed var(--rule2);border-radius:16px;padding:22px;text-align:center;color:var(--mute)}
.hidden{display:none!important}
</style>
</head>

const REF={
day:{en:()=>`<p class="lead">Saturday 28 November 2026, Expo office building. In the building it is an operating day in May 2027.</p>${dayTimeline()}<div class="note yel">${t('dayTBC')} <span class="tbc">TBC</span></div>
 <h3>Four things to remember</h3><ul class="clean"><li><b>It is not a test of you.</b> We check plans, tools and how information moves. We look for gaps, not mistakes.</li><li><b>Stay in your role</b> until the exercise team ends the simulation.</li><li><b>Not every team gets a situation.</b> Several things happen at once in different places. Some teams will talk through a situation together instead.</li><li><b>Act first, log after.</b> Deal with it, then record it.</li></ul>`,
 sr:()=>`<p class="lead">Subota, 28. novembar 2026, poslovna zgrada Expa. U zgradi je radni dan u maju 2027.</p>${dayTimeline()}<div class="note yel">${t('dayTBC')} <span class="tbc">TBC</span></div>
 <h3>Četiri stvari koje treba zapamtiti</h3><ul class="clean"><li><b>Ovo nije test za vas.</b> Proveravamo planove, alate i kako se informacije prenose. Tražimo praznine, ne greške.</li><li><b>Ostanite u svojoj ulozi</b> dok tim za vežbu ne završi simulaciju.</li><li><b>Ne dobija svaki tim situaciju.</b> Više stvari se dešava u isto vreme na različitim mestima. Neki timovi će umesto toga zajedno razgovarati o situaciji.</li><li><b>Prvo reaguj, posle zabeleži.</b> Rešite, zatim zapišite.</li></ul>`},

radio:{en:()=>`<div class="note teal"><b>On the radio we speak English.</b> Speak slowly and clearly so everyone understands.</div>
 <ol class="steps"><li><b>Listen first</b>Check nobody is talking. Press the button, wait 2 seconds, then speak.</li><li><b>Call sign first</b>Say who you are calling, then who you are. "Site Control, this is Catering 1."</li><li><b>Short and plain</b>Simple words, no abbreviations.</li><li><b>Protect sensitive information</b>Never say "fire" or "bomb" on the radio. Use the agreed code words. <span class="tbc">Code words TBC</span></li><li><b>Emergencies go first</b>Stop talking if someone has an emergency.</li><li><b>Repeat back</b>Repeat important instructions to confirm.</li><li><b>Stay on your channel</b>Do not change channel unless told.</li></ol>
 <h3>Words</h3><p><span class="pill" style="background:var(--lilacL)">Over</span> I am waiting for your answer. <br><span class="pill" style="background:var(--lilacL)">Out</span> I have finished. <br><span class="pill" style="background:var(--lilacL)">Roger</span> I heard and understood.</p>
 <h3>Your radio</h3><ul class="clean"><li>Radios belong to roles, not people. Whoever is on shift holds it.</li><li>You get it at check-in on the day. Radios are not handed out before.</li><li>The box has the radio, 2 batteries and a charger. Return everything.</li><li>Not everyone has a radio. Agree in your team who holds it.</li><li>Tactical Group Leads have no radio on the day. Site Control has the radio for floor 7.</li><li>Radio traffic is recorded.</li></ul>`,
 sr:()=>`<div class="note teal"><b>Preko radija govorimo engleski.</b> Govorite sporo i jasno da svi razumeju.</div>
 <ol class="steps"><li><b>Prvo slušajte</b>Proverite da niko ne govori. Pritisnite dugme, sačekajte 2 sekunde, pa govorite.</li><li><b>Prvo pozivni znak</b>Recite koga zovete, pa ko ste vi. "Site Control, this is Catering 1."</li><li><b>Kratko i jasno</b>Jednostavne reči, bez skraćenica.</li><li><b>Zaštitite osetljive informacije</b>Nikada ne recite "fire" ili "bomb" preko radija. Koristite dogovorene šifre. <span class="tbc">Šifre TBC</span></li><li><b>Hitni slučajevi imaju prednost</b>Prestanite da govorite ako neko ima hitan slučaj.</li><li><b>Ponovite</b>Ponovite važna uputstva da potvrdite.</li><li><b>Ostanite na svom kanalu</b>Ne menjajte kanal osim ako vam se ne kaže.</li></ol>
 <h3>Reči</h3><p><span class="pill" style="background:var(--lilacL)">Over</span> Čekam vaš odgovor. <br><span class="pill" style="background:var(--lilacL)">Out</span> Završio/la sam. <br><span class="pill" style="background:var(--lilacL)">Roger</span> Čuo/la sam i razumeo/la.</p>
 <h3>Vaš radio</h3><ul class="clean"><li>Radio pripada ulozi, ne osobi. Ko je u smeni, taj ga drži.</li><li>Dobijate ga na prijavi tog dana. Radio se ne deli unapred.</li><li>U kutiji su radio, 2 baterije i punjač. Vratite sve.</li><li>Nema svako radio. Dogovorite u timu ko ga drži.</li><li>Lideri taktičkih grupa tog dana nemaju radio. Site Control ima radio za 7. sprat.</li><li>Radio-saobraćaj se snima.</li></ul>`},
komu:{en:()=>`<p class="lead">Komunikator is the messaging app for the simulation and for event time. It replaces WhatsApp for work messages.</p>
 <ol class="steps"><li><b>Install and register by Monday 23 November</b>You get an invitation by email from IT.</li><li><b>No invitation?</b>Contact the technology team (Nemanja).</li><li><b>Groups</b>Your groups are set up before the day. Check you can see them.</li></ol>
 <h3>Use it for</h3><ul class="clean"><li>Group updates to many people at once, like the start message.</li><li>Photos and short reports.</li><li>Not for urgent calls: use the radio. Not for private details: use the phone.</li></ul>`,
 sr:()=>`<p class="lead">Komunikator je aplikacija za poruke za simulaciju i za vreme događaja. Zamenjuje WhatsApp za poslovne poruke.</p>
 <ol class="steps"><li><b>Instalirajte i registrujte se do ponedeljka 23. novembra</b>Pozivnicu dobijate imejlom od IT-a.</li><li><b>Niste dobili pozivnicu?</b>Javite se timu za tehnologiju (Nemanja).</li><li><b>Grupe</b>Vaše grupe se prave pre dana simulacije. Proverite da li ih vidite.</li></ol>
 <h3>Koristite ga za</h3><ul class="clean"><li>Obaveštenja za više ljudi odjednom, kao poruka o početku.</li><li>Fotografije i kratke izveštaje.</li><li>Ne za hitne pozive: koristite radio. Ne za privatne detalje: koristite telefon.</li></ul>`},

imp:{en:()=>`<p class="lead">The Incident Management Platform keeps one record for every problem: who owns it, its status and its time. On 28 November we use a smaller version.</p>
 <ol class="steps"><li><b>Act first, log after</b>Deal with the problem, then record it. Site Control can help log if you are busy.</li><li><b>Record clearly</b>Where, what happened, severity.</li><li><b>Close it only when it is fixed</b>Choose a reason: resolved, duplicate, no action needed, or reported in error.</li></ol>
 <div class="imps"><span class="pill" style="background:var(--lilacL)">Open</span> → <span class="pill" style="background:var(--lilacL)">In Progress</span> ⇄ <span class="pill" style="background:var(--lilacL)">On Hold</span> → <span class="pill" style="background:var(--lilacL)">Closed</span></div>
 <ul class="clean"><li>A problem that is not logged did not happen, for the record. It also protects Expo later.</li><li>Logging is how your team gets help. It is not reporting on colleagues.</li><li>Very sensitive issues are handled by phone, not in the platform.</li><li>Training: Tuesday 24 November.</li></ul>`,

 <div class="imps"><span class="pill" style="background:var(--lilacL)">Open</span> → <span class="pill" style="background:var(--lilacL)">In Progress</span> ⇄ <span class="pill" style="background:var(--lilacL)">On Hold</span> → <span class="pill" style="background:var(--lilacL)">Closed</span></div>
 <ul class="clean"><li>Problem koji nije zabeležen, za zapisnik se nije ni desio. Zapis štiti i Expo kasnije.</li><li>Beleženje je način da vaš tim dobije pomoć. To nije prijavljivanje kolega.</li><li>Veoma osetljiva pitanja rešavaju se telefonom, ne na platformi.</li><li>Obuka: utorak 24. novembra.</li></ul>`},

      <div class="btnrow"><button class="btn" data-go="ref/radio">${t('t_radio')}</button><button class="btn" data-go="ref/tools">${t('t_tools')}</button></div>`,
    day:dayTimeline()+`<div class="note yel">${t('dayTBC')}</div><h3>${t('t_build')}</h3>${floorsHTML(p.floor)}`,
    prep:`<ol class="steps">${t('prepList').map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="btnrow"><button class="btn" data-go="ref/plans">${t('t_plans')}</button></div>`
  };
  if(!panes[TAB])TAB='job';
  app.innerHTML=`<section class="me"><div class="hd" style="background:${col}"><div class="lv">${t('lv')[lv]}</div><div class="dn">${esc(deptName(p.dept))}${p.g?' · '+(LANG==='sr'?'Grupa ':'Group ')+p.g:''}</div><div class="rn">${esc(p.role)}</div></div>
   <div class="where"><div class="fl" style="background:${fcol}">${p.floor||'?'}<small>${t('floor').toUpperCase()}</small></div><div><b>${esc(area.charAt(0).toUpperCase()+area.slice(1))}</b><span class="small">${p.floor?(LANG==='sr'?'Prijava u prizemlju, zatim idite na '+p.floor+'. sprat.':'Check in on the ground floor, then go to floor '+p.floor+'.'):t('tbcFloor')}</span></div></div>
   <div class="tabs">${tabs.map(k=>`<button data-tab="${k}" class="${k===TAB?'on':''}">${t('tab_'+k)}</button>`).join('')}</div>
   <div class="pane">${panes[TAB]}</div></section>
   <div class="btnrow"><button class="btn" id="share">${LANG==='sr'?'Kopiraj link za ovu ulogu':'Copy link to this role'}</button><button class="btn" data-go="find">${LANG==='sr'?'Druga uloga':'Another role'}</button></div>`;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;me(id);});
  const sh=document.getElementById('share');sh.onclick=()=>{const u=location.href;(navigator.share?navigator.share({url:u,title:p.role}):navigator.clipboard.writeText(u).then(()=>sh.textContent='✓')).catch(()=>{});};
}
function contacts(q){
  const qs=(q||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const L=PEOPLE.filter(p=>!qs||(p.name+' '+p.role+' '+deptName(p.dept)+' '+p.dept).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').includes(qs)).sort((a,b)=>deptName(a.dept).localeCompare(deptName(b.dept))||a.name.localeCompare(b.name));
  let html='',cur='';L.forEach(p=>{if(p.dept!==cur){cur=p.dept;html+=`<div class="sec">${esc(deptName(cur))}</div>`;}html+=personRow(p,p.role||'');});
  app.innerHTML=`<h2 style="margin-top:18px">${t('cH')}</h2><p>${t('cP')}</p><input class="search" id="cq" type="search" placeholder="${t('cSearch')}" value="${esc(q||'')}" autocomplete="off"><div class="card" style="padding:4px 16px">${html||`<div class="empty">${t('notFound')}</div>`}</div>`;
  const i=document.getElementById('cq');i.oninput=()=>{const v=i.value;contacts(v);const j=document.getElementById('cq');j.focus();j.setSelectionRange(v.length,v.length);};
}
function faq(){app.innerHTML=`<h2 style="margin-top:18px">${t('faqH')}</h2><div class="card faq">${FAQ[LANG].map(f=>`<details><summary>${esc(f[0])}</summary><p>${f[1]}</p></details>`).join('')}</div>${helpBox()}`;}
function ref(k){const r=REF[k];if(!r){home();return;}app.innerHTML=`<h2 style="margin-top:18px">${t('t_'+k)}</h2><div class="card">${r[LANG]()}</div>${helpBox()}`;}

/* ---------------- ROUTER ---------------- */
function route(){
  const h=decodeURIComponent((location.hash||'#home').slice(1));const [a,...rest]=h.split('/');const b=rest.join('/');
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x.dataset.l===LANG));
  const back=document.getElementById('back');back.textContent='‹ '+t('back');back.classList.toggle('on',a!=='home'&&a!=='');
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x.dataset.go===a||(a==='p'||a==='dept')&&x.dataset.go==='find'));
  if(a==='find')find();else if(a==='dept')dept(b);else if(a==='p')me(b);else if(a==='contacts')contacts();else if(a==='faq')faq();else if(a==='ref')ref(b);else home();
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();if(g.dataset.go.startsWith('p/'))TAB='job';location.hash=g.dataset.go;}});
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('sim_lang',LANG);}catch(e){}route();});
document.getElementById('back').onclick=()=>{history.length>1?history.back():location.hash='home';};
document.getElementById('logo').onclick=()=>location.hash='home';
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
